name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [orda2/prototype]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e .
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
